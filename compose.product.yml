name: fuerte
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.product
    restart: unless-stopped
    ports: ["127.0.0.1:3500:3500"]
    environment:
      APP_ORIGIN: https://fuerte.signalvise.com
      COOKIE_SECURE: "true"
      AI_URL: http://ai:3501
    volumes: ["fuerte_data:/data"]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [private, ingress]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3500/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
  ai:
    build:
      context: .
      dockerfile: Dockerfile.ai
    restart: unless-stopped
    volumes: ["codex_auth:/auth"]
    mem_limit: 512m
    cpus: 0.75
    pids_limit: 96
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [private, outbound]
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
volumes:
  fuerte_data:
  codex_auth:
networks:
  private:
    internal: true
  outbound:
  ingress:
